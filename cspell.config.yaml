version: "0.2"
import:
  - "@cspell/dict-pt-br/cspell-ext.json"
language: en, pt-br
ignorePaths:
  - .pylintrc
  - .gitignore
  - .gitattributes
  - cspell.config.yaml
  - .clang-tidy
dictionaries:
  - en_us
  - en-gb
  - pt-br
  - cpp
  - bash
  - aws
  - softwareTerms
words:
  - gpio
  - LOGI
  - lvgl
  - meupc
  - mipi
  - mosi
  - MOSI
  - pclk
  - picolibc
  - POSEDGE
  - psram
  - quadhd
  - quadwp
  - sclk
  - SPIRAM
  - xtensa
